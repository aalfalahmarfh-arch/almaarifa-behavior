<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحفيز | برنامج التميز السلوكي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#0d9488;--teal-dark:#0f766e;--teal-light:#ccfbf1;--gold:#f59e0b;--gold-light:#fef3c7;--red:#ef4444;--green:#22c55e;--bg:#f0fdfa;--bg2:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--shadow:0 4px 24px rgba(13,148,136,.12);--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
body.tv-mode{background:#0a0f1e;color:#fff;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Tajawal',sans-serif;direction:rtl}
.hidden{display:none!important}

/* Layout */
.sidebar{position:fixed;right:0;top:0;width:240px;height:100vh;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.main-content{margin-right:240px;min-height:100vh;padding:28px}
.top-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}

/* Sidebar */
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-logo span{font-weight:700;font-size:1rem;color:var(--teal-dark)}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-radius:10px;margin:2px 8px;transition:.2s;color:var(--text2);font-size:.95rem}
.nav-item:hover{background:var(--teal-light);color:var(--teal-dark)}
.nav-item.active{background:var(--teal-light);color:var(--teal-dark);font-weight:600}
.nav-item svg{flex-shrink:0;opacity:.8}
.sidebar-footer{margin-top:auto;padding:12px}
.btn-logout{width:100%;padding:10px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:.9rem;transition:.2s}
.btn-logout:hover{background:#fee2e2;color:var(--red);border-color:var(--red)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;font-size:.95rem;font-weight:500;transition:.2s;cursor:pointer;border:none}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#d97706}
.btn-outline{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.btn-outline:hover{background:var(--teal-light)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 12px;font-size:.85rem}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text2);transition:.2s}
.btn-icon:hover{border-color:var(--teal);color:var(--teal)}

/* Cards */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:1.05rem;font-weight:700;color:var(--text)}
.stat-card{border-radius:var(--radius);padding:20px;color:#fff;position:relative;overflow:hidden}
.stat-card .num{font-size:2rem;font-weight:900}
.stat-card .lbl{font-size:.85rem;opacity:.9;margin-top:2px}
.stat-card .icon-bg{position:absolute;left:-10px;bottom:-10px;opacity:.15}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:500;color:var(--text)}
.form-control{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;transition:.2s;background:#fff;color:var(--text)}
.form-control:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--teal-light);color:var(--teal-dark);font-weight:600;padding:11px 14px;font-size:.9rem;text-align:right}
td{padding:10px 14px;font-size:.92rem;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fffe}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:600}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-gold{background:#fef3c7;color:#d97706}
.badge-gray{background:#f1f5f9;color:#64748b}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px 24px}
.modal-footer{padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end}

/* Toast */
#toast-container{position:fixed;top:20px;left:20px;z-index:999;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;font-size:.93rem;animation:slideIn .3s ease;min-width:260px;border-right:4px solid var(--teal)}
.toast.error{border-right-color:var(--red)}
.toast.success{border-right-color:var(--green)}
.toast.warning{border-right-color:var(--gold)}
@keyframes slideIn{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateX(-60px)}}

/* Entry screen */
.entry-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d9488 0%,#0f766e 40%,#134e4a 100%);padding:20px}
.entry-container{max-width:820px;width:100%}
.entry-title{text-align:center;color:#fff;font-size:2rem;font-weight:900;margin-bottom:8px}
.entry-sub{text-align:center;color:rgba(255,255,255,.75);margin-bottom:36px;font-size:1rem}
.entry-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.entry-card{background:linear-gradient(135deg,var(--logo-c1,rgba(255,255,255,.14)),var(--logo-c2,rgba(255,255,255,.06)));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:32px 24px;text-align:center;cursor:pointer;transition:.25s;color:#fff}
.entry-card:hover{background:linear-gradient(135deg,var(--logo-c1-hover,rgba(255,255,255,.22)),var(--logo-c2-hover,rgba(255,255,255,.1)));transform:translateY(-3px)}
.entry-card .icon-wrap{width:70px;height:70px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.entry-card h3{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.entry-card p{font-size:.9rem;opacity:.8}
.entry-form-wrap{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:28px;margin-top:20px}
.entry-form-wrap .form-control{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.entry-form-wrap .form-control::placeholder{color:rgba(255,255,255,.6)}
.entry-form-wrap label{color:rgba(255,255,255,.9)}
.entry-form-wrap .form-control option{color:#000;background:#fff}
.tabs{display:flex;background:rgba(0,0,0,.2);border-radius:10px;padding:4px;margin-bottom:20px}
.tab-btn{flex:1;padding:8px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.7);font-family:'Tajawal',sans-serif;font-size:.95rem;cursor:pointer;transition:.2s}
.tab-btn.active{background:rgba(255,255,255,.25);color:#fff;font-weight:600}

/* Student dashboard */
.student-wrap{max-width:900px;margin:0 auto;padding:24px}
.points-big{background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-radius:20px;padding:32px;text-align:center;color:#fff;position:relative;overflow:hidden;margin-bottom:24px}
.points-big .num{font-size:4rem;font-weight:900;line-height:1}
.points-big .lbl{font-size:1rem;opacity:.85;margin-top:8px}
.points-big .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;margin-bottom:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}
.lb-row:hover{transform:translateX(-3px)}
.lb-row.highlight{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid var(--gold)}
.rank-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.rank-2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.rank-3{background:linear-gradient(135deg,#cd7c3e,#92400e);color:#fff}
.rank-other{background:var(--teal-light);color:var(--teal-dark)}
.lb-name{flex:1;font-weight:600}
.lb-grade{font-size:.85rem;color:var(--text2)}
.lb-pts{font-size:1.1rem;font-weight:900;color:var(--teal)}

/* TV mode */
.tv-wrap{height:100vh;background:linear-gradient(135deg,#0a0f1e 0%,#0d2137 50%,#0a1628 100%);display:flex;flex-direction:column;padding:2vh 32px;position:relative;overflow:hidden;box-sizing:border-box}
.tv-header{text-align:center;margin-bottom:2vh;flex-shrink:0}
.tv-title{font-size:clamp(1.6rem,4.2vh,3rem);font-weight:900;background:linear-gradient(135deg,#f59e0b,#fcd34d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tv-school{font-size:clamp(.85rem,1.8vh,1.3rem);color:rgba(255,255,255,.7);margin-top:8px}
.tv-rows{max-width:900px;margin:0 auto;width:100%;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between;gap:.8vh;min-height:0}
.tv-row{display:flex;align-items:center;gap:16px;padding:0 20px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);animation:fadeIn .5s ease;flex:1 1 0;min-height:0}
.tv-row.top1{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4)}
.tv-row.top2{background:rgba(148,163,184,.1);border-color:rgba(148,163,184,.3)}
.tv-row.top3{background:rgba(205,124,62,.1);border-color:rgba(205,124,62,.3)}
.tv-rank{width:clamp(28px,5.2vh,50px);height:clamp(28px,5.2vh,50px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(.8rem,1.9vh,1.2rem);flex-shrink:0}
.tv-name{flex:1;font-size:clamp(.9rem,2.6vh,1.5rem);font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-grade-lbl{font-size:clamp(.7rem,1.4vh,.9rem);color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:3px 10px;border-radius:20px;flex-shrink:0}
.tv-pts{font-size:clamp(1rem,3.2vh,2rem);font-weight:900;color:#f59e0b;flex-shrink:0}
.tv-footer{margin-top:1vh;text-align:center;color:rgba(255,255,255,.4);font-size:clamp(.7rem,1.4vh,.9rem);flex-shrink:0}
.star{position:absolute;border-radius:50%;background:#f59e0b;animation:twinkle 2s infinite}

/* Prize/announcement ticker */
.prize-banner{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:12px;margin-bottom:20px;position:relative;direction:ltr;text-align:left}
.prize-banner-track{display:inline-block;padding-left:100%;animation:prizeScroll 30s linear infinite}
.prize-banner-track span{display:inline-block;padding:12px 32px;color:#fff;font-weight:700;font-size:.95rem;direction:rtl}
@keyframes prizeScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.8;transform:scale(1.4)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0}to{opacity:1}}

/* Misc */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:1.4rem;font-weight:800;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state svg{margin:0 auto 12px;display:block;opacity:.4}
.divider{height:1px;background:var(--border);margin:16px 0}
@media(max-width:768px){.entry-cards,.stats-grid,.form-row,.grid-2{grid-template-columns:1fr}.sidebar{width:200px}.main-content{margin-right:200px}}

/* Print cards */
.print-card-grid{display:grid;grid-template-columns:repeat(auto-fill,var(--pc-w,10cm));gap:14px;margin-top:16px;justify-content:center}
.print-card{width:var(--pc-w,10cm);height:var(--pc-h,6cm);box-sizing:border-box;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed var(--logo-border,#94a3b8);border-radius:var(--pc-radius,14px);padding:10px;text-align:center;background:linear-gradient(160deg,var(--logo-tint1,var(--teal-light)) 0%,#fff 65%);position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print-card .pc-logo{width:14cqmin;max-width:40px;min-width:14px;height:auto;aspect-ratio:1/1;object-fit:contain;margin:0 auto 2cqmin;display:block;flex-shrink:0}
.print-card .pc-school{font-size:clamp(.5rem,4.2cqmin,.85rem);color:var(--text2);margin-bottom:2cqmin;font-weight:600;line-height:1.2}
.print-card .pc-number{font-family:monospace;font-size:clamp(.6rem,5cqmin,1.15rem);font-weight:800;letter-spacing:.5px;background:var(--logo-tint2,var(--teal-light));color:var(--logo-solid-dark,var(--teal-dark));padding:2cqmin 3cqmin;border-radius:8px;margin-bottom:2.5cqmin;word-break:break-all;max-width:92%;line-height:1.2}
.print-card .pc-points{font-size:clamp(.95rem,9cqmin,2.2rem);font-weight:900;color:var(--logo-solid-dark,var(--gold));line-height:1}
.print-card .pc-points-lbl{font-size:clamp(.5rem,3.6cqmin,.8rem);color:var(--text2);line-height:1.2}
.print-card .pc-batch{font-size:clamp(.48rem,3.4cqmin,.78rem);color:var(--text2);margin-top:2cqmin;border-top:1px dashed var(--border);padding-top:1.5cqmin;width:100%;line-height:1.2}
.print-card .pc-slogan{font-size:clamp(.46rem,3cqmin,.72rem);color:var(--logo-solid-dark,var(--text2));margin-top:1.5cqmin;font-weight:700;opacity:.85;line-height:1.2}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;top:0;right:0;left:0;width:100%;margin:0;padding:0}
  .print-card{break-inside:avoid;page-break-inside:avoid;border:1.5px solid var(--logo-border,#94a3b8)}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ============ FIREBASE SYNC ============
var firebaseConfig = {
  apiKey: "AIzaSyBchmCvKgrrBnSCqE2kjPyrBiAm4A92RzQ",
  authDomain: "tahfeez-school.firebaseapp.com",
  projectId: "tahfeez-school",
  storageBucket: "tahfeez-school.firebasestorage.app",
  messagingSenderId: "107505093373",
  appId: "1:107505093373:web:ef4cefcde0a3554b680c94"
};
var fbApp=null, db=null, fbAuth=null, fbReady=false, fbBooted=false;
var DATA_KEYS=['school_name','school_logo','school_slogan','students_accounts','students_points',
  'points_log','charging_cards','classes_data','employees_data','messages_data','activity_log','semester_settings','prizes_data'];
var _pendingRerender=false;
try{
  fbApp=firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  fbAuth=firebase.auth();
  fbReady=true;
}catch(e){ console.error('Firebase init failed, running in offline/local-only mode',e); }

// Skip auto re-render while the admin is mid-typing (modal open or an input focused)
// so a background sync from another device doesn't wipe out unsaved input.
function safeToAutoRender(){
  if(activeModal) return false;
  var ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return false;
  return true;
}

function bootFirebaseSync(){
  if(!fbReady){ initData(); render(); return; }
  ensureAnonAuth().then(startFirestoreSync).catch(function(err){
    console.error('Anonymous auth failed, falling back to local-only mode',err);
    initData(); render();
  });
}

// Firestore rules require a signed-in request (even an anonymous one) so the
// database can no longer be read/written by anyone who simply knows the
// public API key from the page source. This silently signs the visitor in
// as an anonymous Firebase user before any Firestore call — completely
// invisible to students, who still just use their normal username/password.
function ensureAnonAuth(){
  if(!fbAuth) return Promise.reject(new Error('no-auth'));
  if(fbAuth.currentUser) return Promise.resolve(fbAuth.currentUser);
  return fbAuth.signInAnonymously().then(function(cred){return cred.user;});
}

function startFirestoreSync(){
  var pending=DATA_KEYS.length;
  var firstLoadDone=false;
  DATA_KEYS.forEach(function(k){
    db.collection('app_data').doc(k).onSnapshot(function(doc){
      if(doc.exists){
        var v=doc.data().value;
        localStorage.setItem(k, JSON.stringify(v));
      }
      if(!firstLoadDone){
        pending--;
        if(pending<=0){
          firstLoadDone=true;
          initData(); // seed any keys that truly don't exist anywhere yet
          fbBooted=true;
          render();
        }
      } else if(fbBooted){
        if(safeToAutoRender()) render();
        else _pendingRerender=true;
      }
    },function(err){
      console.error('Firestore sync error for '+k,err);
      if(!firstLoadDone){ pending--; if(pending<=0){ firstLoadDone=true; initData(); fbBooted=true; render(); } }
    });
  });
  // If the admin closes a modal or blurs a field, flush any deferred remote update
  document.addEventListener('click',function(e){
    if(e.target && e.target.closest && e.target.closest('[data-action="modal-close"]') && _pendingRerender){
      _pendingRerender=false; setTimeout(function(){ if(safeToAutoRender()) render(); },50);
    }
  });
}

// ============ STATE ============
var state = {
  mode: 'entry', // 'entry'|'admin'|'student'|'tv'
  adminPage: 'home',
  currentStudent: null,
  studentSubMode: 'login', // 'login'|'register'|'dashboard'
  entryView: 'choice', // 'choice'|'admin-login'|'student-form'
  dark: false,
  prevMode: null,
  selectedCards: {},
  cardsFilterBatch: 'all',
  bulkPointsMode: 'all',
  bulkPointsGrade: '',
  bulkPointsSelected: {},
  bulkPointsExceptGrade: '',
  bulkPointsExcluded: {},
  printCardWidthCm: 10,
  printCardHeightCm: 6,
  printCardColorKey: 'auto',
  printCardShape: 'default'
};

// ============ DATA HELPERS ============
function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function ss(k,v){
  localStorage.setItem(k,JSON.stringify(v));
  if(fbReady && DATA_KEYS.indexOf(k)!==-1){
    db.collection('app_data').doc(k).set({value:v}).catch(function(e){
      console.error('Firestore write failed for '+k,e);
      toast('error','تعذر مزامنة البيانات مع الإنترنت');
    });
  }
}


// Atomic Firestore helper for operations that must be safe across many devices.
// It reads the latest server values inside a transaction, applies one mutation,
// and writes all affected documents together. Firestore retries automatically
// if another device changes one of the same documents at the same moment.
function atomicUpdate(keys,mutator){
  if(!fbReady||!db) return Promise.reject(Object.assign(new Error('OFFLINE'),{code:'OFFLINE'}));
  var refs=keys.map(function(k){return db.collection('app_data').doc(k);});
  var resultData=null,resultValue=null;
  return db.runTransaction(function(tx){
    return Promise.all(refs.map(function(r){return tx.get(r);})).then(function(snaps){
      var data={};
      snaps.forEach(function(snap,i){
        var k=keys[i];
        if(snap.exists) data[k]=snap.data().value;
        else data[k]=ls(k);
      });
      // Deep-clone mutable values so the mutator never changes localStorage by reference.
      keys.forEach(function(k){
        if(data[k]!==undefined && data[k]!==null) data[k]=JSON.parse(JSON.stringify(data[k]));
      });
      resultValue=mutator(data);
      keys.forEach(function(k,i){tx.set(refs[i],{value:data[k]});});
      resultData=data;
    });
  }).then(function(){
    keys.forEach(function(k){localStorage.setItem(k,JSON.stringify(resultData[k]));});
    return resultValue;
  });
}

function atomicError(code,message){var e=new Error(message||code);e.code=code;return e;}

}

// ============ RENDER ENGINE ============
function render(){
  var app=document.getElementById('app');
  // Preserve focus/cursor position across a re-render for inputs the user
  // is actively typing in (e.g. live search) so typing doesn't lose focus.
  var focusedId=null,selStart=null,selEnd=null;
  var ae=document.activeElement;
  if(ae&&ae.id&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    focusedId=ae.id;
    try{selStart=ae.selectionStart;selEnd=ae.selectionEnd;}catch(e){}
  }
  applyLogoTheme();
  if(state.mode==='tv'){renderTV();return;}
  if(state.mode==='entry') app.innerHTML=renderEntry();
  else if(state.mode==='admin') app.innerHTML=renderAdminLayout();
  else if(state.mode==='student') app.innerHTML=renderStudentLayout();
  attachEvents();
  if(focusedId){
    var el=document.getElementById(focusedId);
    if(el){
      el.focus();
      if(selStart!==null&&el.setSelectionRange){try{el.setSelectionRange(selStart,selEnd);}catch(e){}}
    }
  }
}

// Extracts the dominant colors from the uploaded school logo and exposes
// them as CSS variables (--logo-c1/--logo-c2) so card backgrounds on the
// entry screen pick up the logo's own colors instead of a generic tint.
var _logoColorCache={src:null};
function applyLogoTheme(){
  var root=document.documentElement;
  var logo=ls('school_logo');
  if(!logo){
    if(_logoColorCache.src){
      root.style.removeProperty('--logo-c1');root.style.removeProperty('--logo-c2');
      root.style.removeProperty('--logo-c1-hover');root.style.removeProperty('--logo-c2-hover');
      root.style.removeProperty('--logo-tint1');root.style.removeProperty('--logo-tint2');
      root.style.removeProperty('--logo-solid-dark');root.style.removeProperty('--logo-border');
      _logoColorCache={src:null};
    }
    return;
  }
  if(_logoColorCache.src===logo) return; // already extracted for this logo
  var img=new Image();
  img.onload=function(){
    try{
      var w=32,h=32;
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      var data=ctx.getImageData(0,0,w,h).data;
      var pixels=[];
      for(var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if(a<100) continue;
        var max=Math.max(r,g,b),min=Math.min(r,g,b);
        if(max>240&&min>225) continue; // near-white background
        if(max<25) continue; // near-black outline
        pixels.push([r,g,b]);
      }
      if(!pixels.length) return;
      // favor the most saturated (vivid) pixels so we pick up brand colors
      // rather than an average grey
      pixels.sort(function(a,b){
        return (Math.max.apply(null,b)-Math.min.apply(null,b))-(Math.max.apply(null,a)-Math.min.apply(null,a));
      });
      var top=pixels.slice(0,Math.max(1,Math.floor(pixels.length*0.35)));
      var sum=[0,0,0];
      top.forEach(function(c){sum[0]+=c[0];sum[1]+=c[1];sum[2]+=c[2];});
      var avg=[Math.round(sum[0]/top.length),Math.round(sum[1]/top.length),Math.round(sum[2]/top.length)];
      var dark=avg.map(function(v){return Math.round(v*0.55)});
      var c1='rgba('+avg[0]+','+avg[1]+','+avg[2]+',.5)';
      var c2='rgba('+dark[0]+','+dark[1]+','+dark[2]+',.5)';
      var c1h='rgba('+avg[0]+','+avg[1]+','+avg[2]+',.68)';
      var c2h='rgba('+dark[0]+','+dark[1]+','+dark[2]+',.68)';
      var tint1='rgba('+avg[0]+','+avg[1]+','+avg[2]+',.16)';
      var tint2='rgba('+avg[0]+','+avg[1]+','+avg[2]+',.06)';
      var solidDark='rgb('+dark[0]+','+dark[1]+','+dark[2]+')';
      var borderCol='rgba('+dark[0]+','+dark[1]+','+dark[2]+',.55)';
      root.style.setProperty('--logo-c1',c1);
      root.style.setProperty('--logo-c2',c2);
      root.style.setProperty('--logo-c1-hover',c1h);
      root.style.setProperty('--logo-c2-hover',c2h);
      root.style.setProperty('--logo-tint1',tint1);
      root.style.setProperty('--logo-tint2',tint2);
      root.style.setProperty('--logo-solid-dark',solidDark);
      root.style.setProperty('--logo-border',borderCol);
      _logoColorCache={src:logo};
    }catch(e){ /* canvas read can fail for tainted images — silently fall back */ }
  };
  img.src=logo;
}

var GRADE_LEVELS=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
var ALL_SECTION_LETTERS=['أ','ب','ج','د','ه','و','ز','ح'];
function getSectionsForLevel(level){
  var idx=GRADE_LEVELS.indexOf(level);
  var count=(idx===0)?8:7;
  return ALL_SECTION_LETTERS.slice(0,count);
}
function buildClassName(level,section){return 'الصف '+level+' الابتدائي - '+section;}
function getAllClassNames(){
  var out=[];
  GRADE_LEVELS.forEach(function(l){getSectionsForLevel(l).forEach(function(s){out.push(buildClassName(l,s));});});
  return out;
}

function renderAdminCards(){
  var cards=ls('charging_cards')||[];
  var batches=[];
  var seen={};
  cards.forEach(function(c){
    var key=c.batchId||'none';
    if(!seen[key]){seen[key]=true;batches.push({id:key,name:c.batchName||'بدون اسم'});}
  });
  var selBatch=state.cardsFilterBatch||'all';
  var batchOptions='<option value="all">كل الدفعات ('+cards.length+' بطاقة)</option>'+
    batches.map(function(b){
      var cnt=cards.filter(function(c){return (c.batchId||'none')===b.id;}).length;
      return '<option value="'+b.id+'"'+(selBatch===b.id?' selected':'')+'>'+b.name+' ('+cnt+' بطاقة)</option>';
    }).join('');
  var byBatch=selBatch==='all'?cards:cards.filter(function(c){return (c.batchId||'none')===selBatch;});
  var cq=(state.cardSearchQuery||'').trim().toUpperCase();
  var filtered=!cq?byBatch:byBatch.filter(function(c){return String(c.number||'').toUpperCase().indexOf(cq)!==-1;});
  var selectedCount=Object.keys(state.selectedCards).filter(function(k){return state.selectedCards[k];}).length;
  var allChecked=filtered.length>0&&filtered.every(function(c){return !!state.selectedCards[c.id];});
  var rows=filtered.length===0?'<tr><td colspan="7"><div class="empty-state"><p>'+(cq?'لا توجد بطاقة بهذا الرقم':'لا توجد بطاقات')+'</p></div></td></tr>':
    filtered.map(function(c){
      var badge=c.status==='نشطة'?'badge-green':c.status==='مستخدمة'?'badge-red':'badge-gray';
      var checked=state.selectedCards[c.id]?' checked':'';
      return '<tr><td><input type="checkbox" class="card-chk" data-id="'+c.id+'"'+checked+'></td>'+
        '<td><code style="font-size:.85rem;background:#f1f5f9;padding:2px 6px;border-radius:6px">'+c.number+'</code></td><td>'+c.value+'</td><td><span class="badge '+badge+'">'+c.status+'</span></td><td>'+(c.batchName||'-')+'</td><td>'+(c.usedBy||'-')+'</td>'+
        '<td>'+(c.status==='نشطة'?'<div style="display:flex;gap:6px"><button class="btn-icon" title="إلغاء البطاقة مع الاحتفاظ بسجلها" data-action="cancel-card" data-id="'+c.id+'">✕</button><button class="btn-icon" title="حذف البطاقة غير المستخدمة" style="border-color:var(--red)" data-action="del-card" data-id="'+c.id+'">'+ICONS.trash+'</button></div>':'<span style="color:var(--text2);font-size:.82rem">محفوظة للسجل</span>')+'</td></tr>';
    }).join('');
  var toolbar='<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">'+

function getSemesterSettings(){
  return ls('semester_settings')||{s1Start:'2025-09-01',s1End:'2026-01-31',s2Start:'2026-02-01',s2End:'2026-06-30'};
}
var MONTH_NAMES_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthKeyOf(d){var dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function monthLabelOf(key){var p=key.split('-');return MONTH_NAMES_AR[+p[1]-1]+' '+p[0];}

function calcSemesterStats(log,startStr,endStr){
  var start=new Date(startStr);var end=new Date(endStr);end.setHours(23,59,59,999);
  var pts=0,count=0,studs={};
  log.forEach(function(l){
    var t=new Date(l.timestamp);
    if(t>=start&&t<=end){pts+=l.points;count++;studs[l.username]=true;}
  });
  return {pts:pts,count:count,studentsCount:Object.keys(studs).length};
}

function getBulkTargets(){
  var accs=ls('students_accounts')||[];
  var mode=state.bulkPointsMode||'all';
  if(mode==='all') return accs;
  if(mode==='grade'){
    var g=state.bulkPointsGrade||'';
    return accs.filter(function(s){return s.grade===g;});
  }
  if(mode==='except'){
    var eg=state.bulkPointsExceptGrade||'';
    var scope=eg?accs.filter(function(s){return s.grade===eg;}):accs;
    var excl=state.bulkPointsExcluded||{};
    return scope.filter(function(s){return !excl[s.username];});
  }
  var sel=state.bulkPointsSelected||{};
  return accs.filter(function(s){return !!sel[s.username];});
}

function doGiveBulkPoints(){
  var valInp=document.getElementById('bulk-points-value');
  var reasonInp=document.getElementById('bulk-points-reason');
  var val=valInp?parseInt(valInp.value,10):NaN;
  if(!val||isNaN(val)){toast('warning','يرجى إدخال عدد نقاط صحيح');return;}
  var reason=(reasonInp&&reasonInp.value.trim())||'منح نقاط جماعي';
  var targets=getBulkTargets();
  if(targets.length===0){toast('warning','لا يوجد طلاب مستهدفون بهذا الاختيار');return;}
  showConfirm('سيتم '+(val>0?'إضافة':'خصم')+' '+Math.abs(val)+' نقطة لعدد '+targets.length+' طالب. متابعة؟',function(){
    if(!fbReady){toast('error','يلزم اتصال بالإنترنت لتنفيذ العملية بأمان');return;}
    atomicUpdate(['students_points','points_log','activity_log'],function(data){
      var pts=data.students_points&&typeof data.students_points==='object'?data.students_points:{};
      var log=Array.isArray(data.points_log)?data.points_log:[];
      var now=new Date().toISOString();
      targets.forEach(function(st,i){
        pts[st.username]=(Number(pts[st.username])||0)+val;
        log.push({id:uniqueId()+i,username:st.username,studentName:st.fullName,barcode:'-',points:val,batchId:'bulk',batchName:reason,timestamp:now});
      });
      data.students_points=pts;data.points_log=log;
      pushActivityAtomic(data,'منح جماعي: '+(val>0?'+':'')+val+' نقطة لعدد '+targets.length+' طالب ('+reason+')');
    }).then(function(){
      toast('success','تم تحديث النقاط لعدد '+targets.length+' طالب');
      state.bulkPointsSelected={};state.bulkPointsExcluded={};render();
    }).catch(function(err){console.error(err);toast('error','تعذر تحديث النقاط. لم يتم تنفيذ العملية');});
  });
}

function renderPrintCards(){
  var cards=ls('charging_cards')||[];
  var batches=[];
  var seen={};
  cards.forEach(function(c){
    var key=c.batchId||'none';
    if(!seen[key]){seen[key]=true;batches.push({id:key,name:c.batchName||'بدون اسم'});}
  });
  var selBatch=state.printBatch||'all';
  var options='<option value="all">كل الدفعات ('+cards.length+' بطاقة)</option>'+
    batches.map(function(b){
      var cnt=cards.filter(function(c){return (c.batchId||'none')===b.id;}).length;
      return '<option value="'+b.id+'"'+(selBatch===b.id?' selected':'')+'>'+b.name+' ('+cnt+' بطاقة)</option>';
    }).join('');
  var filtered=selBatch==='all'?cards:cards.filter(function(c){return (c.batchId||'none')===selBatch;});
  var school=ls('school_name')||'مدارس ابتدائية باب المعرفة';
  var slogan=ls('school_slogan')||'جودة في التعلم وبناء في القيم';
  var logo=ls('school_logo');
  var logoHtml=logo?'<img class="pc-logo" src="'+logo+'">':'';
  var wCm=state.printCardWidthCm||10;
  var hCm=state.printCardHeightCm||6;
  var colorKey=state.printCardColorKey||'auto';
  var shapeKey=state.printCardShape||'default';
  var cardStyle='--pc-w:'+wCm+'cm;--pc-h:'+hCm+'cm;--pc-radius:'+CARD_SHAPES[shapeKey].radius+';';
  if(colorKey!=='auto'){
    var th=CARD_THEMES[colorKey];
    cardStyle+='--logo-tint1:'+th.t1+';--logo-tint2:'+th.t2+';--logo-solid-dark:'+th.dark+';--logo-border:'+th.border+';';
  }
  var cardsHtml=filtered.length===0?'<div class="empty-state"><p>لا توجد بطاقات في هذه الدفعة</p></div>':
    '<div class="print-card-grid">'+filtered.map(function(c){
      return '<div class="print-card" style="'+cardStyle+'">'+logoHtml+
        '<div class="pc-school">'+school+'</div>'+
        '<div class="pc-number">'+c.number+'</div>'+
        '<div class="pc-points">'+c.value+'</div>'+
        '<div class="pc-points-lbl">نقطة</div>'+
        '<div class="pc-batch">'+(c.batchName||'-')+'</div>'+
        (slogan?'<div class="pc-slogan">'+slogan+'</div>':'')+
        '</div>';
    }).join('')+'</div>';
  var colorButtons='<button type="button" class="btn btn-sm '+(colorKey==='auto'?'btn-primary':'btn-outline')+'" data-action="pc-color" data-color="auto">تلقائي (حسب الشعار)</button>'+
    Object.keys(CARD_THEMES).map(function(k){
      var th=CARD_THEMES[k];
      return '<button type="button" class="btn btn-sm '+(colorKey===k?'btn-primary':'btn-outline')+'" data-action="pc-color" data-color="'+k+'" style="'+(colorKey===k?'':'background:'+th.t1+';color:'+th.dark+';border-color:'+th.border)+'">'+th.name+'</button>';
    }).join('');
  var shapeButtons=Object.keys(CARD_SHAPES).map(function(k){
    var sh=CARD_SHAPES[k];
    return '<button type="button" class="btn btn-sm '+(shapeKey===k?'btn-primary':'btn-outline')+'" data-action="pc-shape" data-shape="'+k+'">'+sh.name+'</button>';
  }).join('');
  return '<div class="card no-print" style="margin-bottom:16px">'+
    '<div class="form-group" style="margin-bottom:14px"><label>اختر الدفعة</label><select class="form-control" id="print-batch-select" onchange="setPrintBatch(this.value)">'+options+'</select></div>'+
    '<div class="form-row">'+
    '<div class="form-group"><label>عرض البطاقة (سم)</label><input class="form-control" type="number" min="3" max="30" step="0.5" value="'+wCm+'" id="pc-width-input" onchange="setPrintCardSize(this.value,null)"></div>'+
    '<div class="form-group"><label>طول البطاقة (سم)</label><input class="form-control" type="number" min="3" max="30" step="0.5" value="'+hCm+'" id="pc-height-input" onchange="setPrintCardSize(null,this.value)"></div>'+
    '</div>'+
    '<div class="form-group"><label>لون البطاقة</label><div style="display:flex;gap:8px;flex-wrap:wrap">'+colorButtons+'</div></div>'+
    '<div class="form-group"><label>شكل الزوايا</label><div style="display:flex;gap:8px;flex-wrap:wrap">'+shapeButtons+'</div></div>'+
    '<button class="btn btn-primary" data-action="do-print-cards">'+ICONS.print+' طباعة / حفظ PDF</button> '+
    '<button class="btn btn-outline" data-action="export-cards-word">'+ICONS.print+' تنزيل ملف Word</button>'+

function doExportCardsWord(){
  var cards=ls('charging_cards')||[];
  var selBatch=state.printBatch||'all';
  var filtered=selBatch==='all'?cards:cards.filter(function(c){return (c.batchId||'none')===selBatch;});
  if(filtered.length===0){toast('warning','لا توجد بطاقات لتصديرها');return;}
  var school=ls('school_name')||'مدارس ابتدائية باب المعرفة';
  var slogan=ls('school_slogan')||'جودة في التعلم وبناء في القيم';
  var logo=ls('school_logo');
  var wCm=state.printCardWidthCm||10;
  var hCm=state.printCardHeightCm||6;
  var colorKey=state.printCardColorKey||'auto';
  var th;
  if(colorKey!=='auto'){
    th=CARD_THEMES[colorKey];
  } else {
    var cs=getComputedStyle(document.documentElement);
    th={
      t1:(cs.getPropertyValue('--logo-tint1')||'#ccfbf1').trim()||'#ccfbf1',
      t2:(cs.getPropertyValue('--logo-tint2')||'#99f6e4').trim()||'#99f6e4',
      dark:(cs.getPropertyValue('--logo-solid-dark')||'#0f766e').trim()||'#0f766e',
      border:(cs.getPropertyValue('--logo-border')||'#5eead4').trim()||'#5eead4'
    };
  }
  function clampNum(mn,val,mx){return Math.max(mn,Math.min(mx,val));}
  var m=Math.min(wCm,hCm);
  var showLogo=logo && hCm>=3 && wCm>=4;
  var showSchool=m>=2.2;
  var showBatch=hCm>=3;
  var showSlogan=hCm>=4.5;
  var logoCm=Math.min(1.3,hCm*0.22,wCm*0.22).toFixed(2);
  var schoolFont=clampNum(8,Math.round(m*2.0),16);
  var numberFont=clampNum(9,Math.round(m*2.3),20);
  var pointsFont=clampNum(13,Math.round(m*5.2),46);
  var lblFont=clampNum(7,Math.round(m*1.5),12);
  var batchFont=clampNum(7,Math.round(m*1.4),11);
  var sloganFont=clampNum(6,Math.round(m*1.2),10);
  var contentWidthCm=19;
  var cols=Math.max(1,Math.floor(contentWidthCm/wCm));
  var rowsHtml='';
  for(var i=0;i<filtered.length;i+=cols){
    var rowCards=filtered.slice(i,i+cols);
    rowsHtml+='<tr>';
    rowCards.forEach(function(c){
      var inner='';
      if(showLogo) inner+='<img src="'+logo+'" style="width:'+logoCm+'cm;height:'+logoCm+'cm;object-fit:contain"><br>';
      if(showSchool) inner+='<span style="font-size:'+schoolFont+'pt;line-height:1.3;color:#555">'+school+'</span><br>';
      inner+='<span style="font-size:'+numberFont+'pt;line-height:1.4;font-weight:bold;font-family:Consolas,monospace;background-color:'+th.t2+';color:'+th.dark+';padding:2pt 6pt;mso-line-height-rule:exactly">'+c.number+'</span><br>';
      inner+='<span style="font-size:'+pointsFont+'pt;line-height:1.2;font-weight:bold;color:'+th.dark+'">'+c.value+'</span><br>';
      inner+='<span style="font-size:'+lblFont+'pt;line-height:1.3;color:#555">نقطة</span>';
      if(showBatch) inner+='<br><span style="font-size:'+batchFont+'pt;line-height:1.3;color:#777">'+(c.batchName||'-')+'</span>';
      if(showSlogan && slogan) inner+='<br><span style="font-size:'+sloganFont+'pt;line-height:1.3;font-weight:bold;color:'+th.dark+'">'+slogan+'</span>';
      rowsHtml+='<td style="width:'+wCm+'cm;height:'+hCm+'cm;padding:0.25cm;vertical-align:top">'+
        '<table style="width:'+wCm+'cm;height:'+hCm+'cm;border:1.5pt dashed '+th.border+';background-color:'+th.t1+'" cellpadding="0" cellspacing="0"><tr><td style="text-align:center;vertical-align:middle;padding:0.15cm">'+
        inner+
        '</td></tr></table></td>';
    });
    rowsHtml+='</tr>';
  }
  var docHtml='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8">'+
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->'+
    '<style>@page{size:21cm 29.7cm;margin:1.2cm}body{font-family:Arial,sans-serif;direction:rtl}table{border-collapse:separate}</style>'+
    '</head><body><table style="width:100%">'+rowsHtml+'</table></body></html>';
  var blob=new Blob(['\ufeff'+docHtml],{type:'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='بطاقات-الشحن.doc';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('تنزيل بطاقات الشحن كملف Word');
  toast('success','تم تنزيل ملف Word');
}

// ============ TV MODE ============
function renderTV(){
  var fullLb=getLeaderboard().slice(0,50);
  var perPage=10;
  var totalPages=Math.max(1,Math.ceil(fullLb.length/perPage));
  if(typeof window._tvPage!=='number') window._tvPage=0;
  var page=window._tvPage%totalPages;
  var lb=fullLb.slice(page*perPage,page*perPage+perPage);
  var school=ls('school_name')||'مدارس ابتدائية باب المعرفة';
  var stars='';
  for(var i=0;i<20;i++){
    var x=Math.random()*100;var y=Math.random()*100;var s=Math.random()*3+1;var d=Math.random()*3;
    stars+='<div class="star" style="left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+d+'s"></div>';
  }
  var rows=lb.map(function(s,i){
    var rank=page*perPage+i;
    var rc=rank===0?'rank-1':rank===1?'rank-2':rank===2?'rank-3':'rank-other';
    var tc=rank===0?' top1':rank===1?' top2':rank===2?' top3':'';
    return '<div class="tv-row'+tc+'" style="animation-delay:'+(i*0.1)+'s"><div class="tv-rank '+rc+'">'+(rank+1)+'</div>'+
      '<div class="tv-name">'+s.name+'</div><div class="tv-grade-lbl">الصف '+s.grade+'</div><div class="tv-pts">'+s.pts+'</div></div>';
  }).join('');
  var emptyNote=fullLb.length===0?'<div style="text-align:center;color:rgba(255,255,255,.4);padding:60px;font-size:1.5rem">لم يتم شحن نقاط بعد</div>':'';
  var pageNote=totalPages>1?' | صفحة '+(page+1)+' من '+totalPages+' (المراكز '+(page*perPage+1)+'-'+(page*perPage+lb.length)+')':'';

  if(!fbReady||!fbAuth){toast('error','تعذر الاتصال بخدمة تسجيل الدخول');return;}

  }).catch(function(err){

function doStudentLogin(){
  var u=document.getElementById('st-login-user');
  var p=document.getElementById('st-login-pass');
  if(!u||!p) return;
  var rawUser=u.value,rawPass=p.value;
  var username=stripToEnglish(rawUser).trim().toLowerCase();var pass=stripToEnglish(rawPass).trim();
  if(!username||!pass){
    if(/[\u0600-\u06FF]/.test(rawUser)||/[\u0600-\u06FF]/.test(rawPass)){
      toast('error','اسم المستخدم وكلمة المرور يجب أن يكونوا بحروف إنجليزية/أرقام فقط. إذا حسابك القديم كان بالعربي، تواصل مع الإدارة لتحديثه');
    } else {
      toast('warning','يرجى إدخال اسم المستخدم وكلمة المرور');
    }
    return;
  }
  var accs=ls('students_accounts')||[];
  var acc=accs.find(function(a){return String(a.username||'').toLowerCase()===username&&a.password===pass;});
  if(acc){
    proceedStudentLogin(acc);
    return;
  }
  // Local cache might be a step behind (e.g. registered on another device, or
  // a brief connection hiccup) — before declaring failure, check the freshest
  // copy directly from the server rather than trusting only the local cache.
  if(fbReady&&db){
    var btn=document.querySelector('[data-action="student-login"]');
    if(btn){btn.disabled=true;btn.textContent='جاري التحقق...';}
    db.collection('app_data').doc('students_accounts').get({source:'server'}).then(function(snap){
      var freshAccs=(snap.exists&&snap.data().value)||[];
      localStorage.setItem('students_accounts',JSON.stringify(freshAccs));
      var freshAcc=freshAccs.find(function(a){return String(a.username||'').toLowerCase()===username&&a.password===pass;});
      if(btn){btn.disabled=false;btn.textContent='دخول';}
      if(freshAcc) proceedStudentLogin(freshAcc);
      else toast('error','اسم المستخدم أو كلمة المرور غير صحيحة');
    }).catch(function(err){
      if(btn){btn.disabled=false;btn.textContent='دخول';}
      console.error('Fresh login check failed',err);
      toast('error','اسم المستخدم أو كلمة المرور غير صحيحة');
    });
  } else {
    toast('error','اسم المستخدم أو كلمة المرور غير صحيحة');
  }
}

function normPhone(v){return String(v||'').replace(/[^0-9]/g,'');}

// ============ CREDENTIAL RULES (English/numbers only) ============
// Student usernames & passwords must be English letters/numbers/underscore only.
// This avoids mismatches caused by visually-similar Arabic characters (ا/أ/إ/آ, ة/ه, ي/ى)
// and invisible marks some mobile Arabic keyboards insert.
var CRED_RE=/^[A-Za-z0-9_]+$/;
function isValidCred(v){return CRED_RE.test(String(v||''));}
function stripToEnglish(v){return String(v||'').replace(/[^A-Za-z0-9_]/g,'');}
var CRED_INPUT_ATTR='oninput="this.value=this.value.replace(/[^A-Za-z0-9_]/g,\'\')" ';

function doRecoverVerify(){
  var userInp=document.getElementById('rec-user');
  var nameInp=document.getElementById('rec-guardian-name');
  var phoneInp=document.getElementById('rec-guardian-phone');
  var username=userInp?stripToEnglish(userInp.value).trim().toLowerCase():'';
  var guardianName=nameInp?nameInp.value.trim().toLowerCase():'';
  var guardianPhone=phoneInp?normPhone(phoneInp.value):'';
  if(!username){toast('warning','يرجى إدخال اسم المستخدم');return;}
  if(!guardianName&&!guardianPhone){toast('warning','يرجى إدخال اسم ولي الأمر أو رقم جواله');return;}
  function checkMatch(acc){
    if(!acc) return false;
    var accName=String(acc.guardianName||'').trim().toLowerCase();
    var accPhone=normPhone(acc.guardianPhone);
    var nameMatches=guardianName&&accName&&accName===guardianName;
    var phoneMatches=guardianPhone&&accPhone&&accPhone===guardianPhone;
    return !!(nameMatches||phoneMatches);
  }
  var btn=document.querySelector('[data-action="recover-verify"]');
  if(btn){btn.disabled=true;btn.textContent='جاري التحقق...';}
  function finish(acc,matched){
    if(btn){btn.disabled=false;btn.textContent='تحقق';}
    if(matched){
      state.recoverVerifiedUser=acc.username;
      state.recoverStep=2;
      toast('success','تم التحقق، عيّن كلمة مرور جديدة');
      render();
    } else {
      toast('error','البيانات المدخلة غير مطابقة');
    }
  }
  var accs=ls('students_accounts')||[];
  var acc=accs.find(function(a){return String(a.username||'').toLowerCase()===username;});
  if(acc&&checkMatch(acc)){finish(acc,true);return;}
  if(fbReady&&db){
    db.collection('app_data').doc('students_accounts').get({source:'server'}).then(function(snap){
      var freshAccs=(snap.exists&&snap.data().value)||[];
      localStorage.setItem('students_accounts',JSON.stringify(freshAccs));
      var freshAcc=freshAccs.find(function(a){return String(a.username||'').toLowerCase()===username;});
      finish(freshAcc,checkMatch(freshAcc));
    }).catch(function(err){
      console.error('Recovery check failed',err);
      finish(null,false);
    });
  } else {
    finish(null,false);
  }
}

function doRecoverSubmit(){
  var p1=document.getElementById('rec-new-pass');
  var p2=document.getElementById('rec-new-pass2');
  var pass=stripToEnglish(p1?p1.value:'').trim();
  var pass2=stripToEnglish(p2?p2.value:'').trim();
  var username=state.recoverVerifiedUser;
  if(!username){toast('error','انتهت صلاحية التحقق، ابدأ من جديد');state.recoverStep=1;render();return;}
  if(!pass||pass.length<4){toast('warning','كلمة المرور يجب أن تكون 4 أحرف/أرقام إنجليزية على الأقل');return;}
  if(!isValidCred(pass)){toast('warning','كلمة المرور يجب أن تتكوّن من حروف إنجليزية وأرقام فقط');return;}
  if(pass!==pass2){toast('error','كلمتا المرور غير متطابقتان');return;}
  if(!fbReady){toast('error','يلزم اتصال بالإنترنت');return;}
  var btn=document.querySelector('[data-action="recover-submit"]');
  if(btn){btn.disabled=true;btn.textContent='جاري الحفظ...';}
  atomicUpdate(['students_accounts'],function(data){
    var accs=Array.isArray(data.students_accounts)?data.students_accounts:[];
    var idx=accs.findIndex(function(a){return String(a.username||'').toLowerCase()===username;});
    if(idx===-1) throw atomicError('NOT_FOUND','لم يتم العثور على الحساب');
    accs[idx].password=pass;
    data.students_accounts=accs;
    return accs[idx];
  }).then(function(){
    if(btn){btn.disabled=false;btn.textContent='حفظ كلمة المرور';}
    toast('success','تم تعيين كلمة المرور الجديدة، يمكنك الدخول الآن');
    state.studentSubMode='login';state.recoverStep=1;state.recoverVerifiedUser=null;
    render();
  }).catch(function(err){
    if(btn){btn.disabled=false;btn.textContent='حفظ كلمة المرور';}
    console.error('Recovery submit failed',err);
    toast('error','تعذر حفظ كلمة المرور، حاول مرة أخرى');
  });
}

// ============ CARD CHARGING ============
function doChargeCard(){
  var inp=document.getElementById('barcode-input');
  if(!inp) return;
  var barcode=inp.value.trim().toUpperCase();
  if(!barcode){toast('warning','يرجى إدخال رقم البطاقة');return;}
  var s=state.currentStudent;
  if(!s){toast('error','يلزم تسجيل الدخول أولاً');return;}
  if(!fbReady){toast('error','يلزم اتصال بالإنترنت لشحن البطاقة بأمان');return;}
  var btn=document.querySelector('[data-action="charge-card"]');
  if(btn){btn.disabled=true;btn.textContent='جاري الشحن...';}
  atomicUpdate(['charging_cards','students_points','points_log','activity_log'],function(data){
    var cards=Array.isArray(data.charging_cards)?data.charging_cards:[];
    var card=cards.find(function(c){return String(c.number||'').toUpperCase()===barcode;});
    if(!card) throw atomicError('CARD_NOT_FOUND');
    if(card.status!=='نشطة'||card.usedBy) throw atomicError('CARD_USED');
    var now=new Date().toISOString();
    card.status='مستخدمة';card.usedBy=s.username;card.usedAt=now;card.assignedTo=s.fullName;
    data.charging_cards=cards;
    var pts=data.students_points&&typeof data.students_points==='object'?data.students_points:{};
    pts[s.username]=(Number(pts[s.username])||0)+Number(card.value||0);
    data.students_points=pts;
    var log=Array.isArray(data.points_log)?data.points_log:[];
    log.push({id:uniqueId(),username:s.username,studentName:s.fullName,barcode:card.number,points:Number(card.value||0),batchId:card.batchId,batchName:card.batchName,timestamp:now});
    data.points_log=log;
    pushActivityAtomic(data,'شحن بطاقة: '+s.fullName+' (+'+card.value+' نقطة)');
    return {value:Number(card.value||0)};
  }).then(function(res){
    toast('success','تم شحن '+res.value+' نقطة بنجاح!');
    inp.value='';render();
  }).catch(function(err){
    if(err&&err.code==='CARD_NOT_FOUND') toast('error','رقم البطاقة غير موجود');
    else if(err&&err.code==='CARD_USED') toast('error','هذه البطاقة مستخدمة أو غير نشطة');
    else if(err&&err.code==='OFFLINE') toast('error','يلزم اتصال بالإنترنت لشحن البطاقة بأمان');
    else {console.error('Safe charging failed',err);toast('error','تعذر شحن البطاقة. لم تتم إضافة أي نقاط، حاول مرة أخرى');}
    if(btn){btn.disabled=false;btn.textContent='شحن النقاط';}
  });
}

function doExportBackup(){
  var data={};
  DATA_KEYS.forEach(function(k){data[k]=ls(k);});
  data._exportedAt=new Date().toISOString();
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  var d=new Date();
  var stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.download='نسخة-احتياطية-'+stamp+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('تنزيل نسخة احتياطية');
  toast('success','تم تنزيل النسخة الاحتياطية');
}

function doImportBackupFile(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    var parsed;
    try{ parsed=JSON.parse(ev.target.result); }
    catch(e){ toast('error','ملف غير صالح'); return; }
    var foundKeys=DATA_KEYS.filter(function(k){return parsed.hasOwnProperty(k);});
    if(foundKeys.length===0){toast('error','هذا الملف لا يحتوي على بيانات نظام صالحة');return;}
    showConfirm('سيتم استبدال جميع البيانات الحالية بالبيانات الموجودة في هذا الملف ('+foundKeys.length+' عنصر). لا يمكن التراجع. متابعة؟',function(){
      foundKeys.forEach(function(k){ss(k,parsed[k]);});
      logActivity('استعادة نسخة احتياطية ('+foundKeys.length+' عنصر)');
      toast('success','تم استيراد النسخة الاحتياطية بنجاح');
      render();
    });
  };
  reader.readAsText(file);
}

function doSaveStudent(){
  var editId=document.getElementById('m-edit-id');
  var name=document.getElementById('m-name').value.trim();
  var grade=document.getElementById('m-grade').value;
  var pass=document.getElementById('m-pass')?stripToEnglish(document.getElementById('m-pass').value).trim():'';
  var guardianName=document.getElementById('m-guardian-name')?document.getElementById('m-guardian-name').value.trim():'';
  var guardianPhone=document.getElementById('m-guardian-phone')?document.getElementById('m-guardian-phone').value.trim():'';
  if(!fbReady){toast('error','يلزم اتصال بالإنترنت لحفظ الطالب بأمان');return;}
  var isEdit=!!editId;
  var id=isEdit?+editId.value:null;
  var user=isEdit
    ?stripToEnglish(document.getElementById('m-username-edit').value).trim().toLowerCase()
    :stripToEnglish(document.getElementById('m-user').value).trim().toLowerCase();
  if(!name||!user||(!isEdit&&!pass)){toast('warning','يرجى ملء جميع الحقول');return;}
  if(!isValidCred(user)){toast('warning','اسم المستخدم يجب أن يتكوّن من حروف إنجليزية وأرقام فقط');return;}
  if(pass&&!isValidCred(pass)){toast('warning','كلمة المرور يجب أن تتكوّن من حروف إنجليزية وأرقام فقط');return;}
  atomicUpdate(['students_accounts','students_points','activity_log'],function(data){
    var accs=Array.isArray(data.students_accounts)?data.students_accounts:[];
    var pts=data.students_points&&typeof data.students_points==='object'?data.students_points:{};
    if(isEdit){
      var idx=accs.findIndex(function(a){return a.id===id;});
      if(idx<0) throw atomicError('STUDENT_NOT_FOUND');
      var oldUser=String(accs[idx].username||'').toLowerCase();
      if(user!==oldUser){
        if(accs.some(function(a,i){return i!==idx&&String(a.username||'').toLowerCase()===user;})) throw atomicError('USERNAME_EXISTS');
        pts[user]=pts[oldUser]!==undefined?pts[oldUser]:0;
        delete pts[oldUser];
        accs[idx].username=user;
      }
      accs[idx].fullName=name;accs[idx].grade=grade;if(pass)accs[idx].password=pass;
      accs[idx].guardianName=guardianName;accs[idx].guardianPhone=guardianPhone;
      pushActivityAtomic(data,'تعديل بيانات الطالب: '+name);
    } else {
      if(accs.some(function(a){return String(a.username||'').toLowerCase()===user;})) throw atomicError('USERNAME_EXISTS');
      accs.push({id:uniqueId(),fullName:name,username:user,password:pass,grade:grade,guardianName:guardianName,guardianPhone:guardianPhone,createdAt:new Date().toISOString()});
      if(pts[user]===undefined) pts[user]=0;
      pushActivityAtomic(data,'إضافة طالب: '+name);
    }
    data.students_accounts=accs;data.students_points=pts;
  }).then(function(){closeModal();toast('success','تم الحفظ');render();})
    .catch(function(err){
      if(err&&err.code==='USERNAME_EXISTS')toast('error','اسم المستخدم مستخدم');
      else if(err&&err.code==='STUDENT_NOT_FOUND')toast('error','الطالب غير موجود');
      else {console.error(err);toast('error','تعذر حفظ الطالب. حاول مرة أخرى');}
    });
}

// ============ CARD CRUD (ADMIN) ============
function genCardNumber(){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var part=function(){var s='';for(var i=0;i<4;i++)s+=chars.charAt(Math.floor(Math.random()*chars.length));return s;};
  var year=new Date().getFullYear();
  var cards=ls('charging_cards')||[];
  var num;
  do{num='SCH-'+year+'-'+part();}while(cards.find(function(c){return c.number===num;}));
  return num;
}

function showAddCardModal(){
  showModal('<div class="modal-header"><h3>إضافة بطاقة شحن</h3><button class="btn-icon" data-action="modal-close">✕</button></div>'+
    '<div class="modal-body">'+
    '<div class="form-group"><label>رقم البطاقة</label>'+
    '<div style="display:flex;gap:8px"><input class="form-control" id="k-number" type="text" value="'+genCardNumber()+'" placeholder="SCH-2026-XXXX">'+
    '<button type="button" class="btn btn-outline btn-sm" data-action="gen-card-number" style="white-space:nowrap">توليد جديد</button></div></div>'+
    '<div class="form-group"><label>القيمة (نقاط)</label><input class="form-control" id="k-value" type="number" value="50"></div>'+
    '<div class="form-group"><label>اسم الباقة</label><input class="form-control" id="k-batch" type="text" placeholder="باقة الربيع"></div>'+
    '<div class="form-group"><label>عدد البطاقات المطلوب إصدارها دفعة واحدة</label><input class="form-control" id="k-count" type="number" value="1" min="1" max="400"></div>'+
    '</div><div class="modal-footer"><button class="btn btn-outline" data-action="modal-close">إلغاء</button><button class="btn btn-primary" data-action="modal-save-card">حفظ</button></div>');
}

function generateUniqueCardNumberAgainst(cards){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var part=function(){var out='';for(var i=0;i<4;i++)out+=chars.charAt(Math.floor(Math.random()*chars.length));return out;};
  var year=new Date().getFullYear(),num;
  do{num='SCH-'+year+'-'+part();}while(cards.some(function(c){return String(c.number||'').toUpperCase()===num;}));
  return num;
}

function doSaveCard(){
  var val=+document.getElementById('k-value').value||0;
  var batch=document.getElementById('k-batch').value.trim();
  var count=Math.max(1,Math.min(400,+document.getElementById('k-count').value||1));
  var manual=(document.getElementById('k-number').value.trim()||'').toUpperCase();
  if(!val||val<1){toast('warning','يرجى إدخال قيمة نقاط صحيحة');return;}
  if(!fbReady){toast('error','يلزم اتصال بالإنترنت لإصدار البطاقات بأمان');return;}
  var batchId='b'+Date.now()+'-'+Math.floor(Math.random()*100000);
  atomicUpdate(['charging_cards','activity_log'],function(data){
    var cards=Array.isArray(data.charging_cards)?data.charging_cards:[];
    var now=new Date().toISOString(),added=[];
    if(count===1){
      var num=manual||generateUniqueCardNumberAgainst(cards);
      if(cards.some(function(c){return String(c.number||'').toUpperCase()===num;})) throw atomicError('CARD_EXISTS');
      var one={id:uniqueId(),number:num,value:val,status:'نشطة',batchId:batchId,batchName:batch,createdAt:now,usedBy:null,usedAt:null};
      cards.push(one);added.push(one);
    } else {
      for(var i=0;i<count;i++){
        var num2=generateUniqueCardNumberAgainst(cards);
        var c={id:uniqueId()+i,number:num2,value:val,status:'نشطة',batchId:batchId,batchName:batch,createdAt:now,usedBy:null,usedAt:null};
        cards.push(c);added.push(c);
      }
    }
    data.charging_cards=cards;pushActivityAtomic(data,'إضافة '+added.length+' بطاقة');
    return added.length;
  }).then(function(n){closeModal();toast('success','تم إضافة '+n+' بطاقة بنجاح');render();})
    .catch(function(err){if(err&&err.code==='CARD_EXISTS')toast('error','رقم البطاقة موجود مسبقاً');else{console.error(err);toast('error','تعذر إصدار البطاقات. لم يتم حفظ أي بطاقة');}});
}

function doCancelCard(id){
  showConfirm('إلغاء هذه البطاقة؟ ستبقى محفوظة في السجل ولن يستطيع أي طالب شحنها.',function(){
    if(!fbReady){toast('error','يلزم اتصال بالإنترنت');return;}
    atomicUpdate(['charging_cards','activity_log'],function(data){
      var cards=Array.isArray(data.charging_cards)?data.charging_cards:[];
      var card=cards.find(function(c){return c.id===id;});
      if(!card) throw atomicError('CARD_NOT_FOUND');
      if(card.status!=='نشطة'||card.usedBy) throw atomicError('CARD_USED');
      card.status='ملغاة';card.cancelledAt=new Date().toISOString();
      data.charging_cards=cards;pushActivityAtomic(data,'إلغاء بطاقة: '+card.number);
    }).then(function(){delete state.selectedCards[id];toast('success','تم إلغاء البطاقة ولن تعمل بعد الآن');render();})
      .catch(function(err){if(err&&err.code==='CARD_USED')toast('error','لا يمكن إلغاء بطاقة مستخدمة');else{console.error(err);toast('error','تعذر إلغاء البطاقة');}});
  });
}

function doDelCard(id){
  var local=(ls('charging_cards')||[]).find(function(c){return c.id===id;});
  if(local&&local.status!=='نشطة'){toast('warning','لا يمكن حذف بطاقة مستخدمة أو ملغاة؛ تبقى محفوظة للسجل');return;}
  showConfirm('حذف هذه البطاقة غير المستخدمة؟ إذا كنت قد طبعتها سابقاً فلن تعمل النسخة المطبوعة بعد الحذف.',function(){
    if(!fbReady){toast('error','يلزم اتصال بالإنترنت للحذف بأمان');return;}
    atomicUpdate(['charging_cards','activity_log'],function(data){
      var cards=Array.isArray(data.charging_cards)?data.charging_cards:[];
      var card=cards.find(function(c){return c.id===id;});
      if(!card) throw atomicError('CARD_NOT_FOUND');
      if(card.status!=='نشطة'||card.usedBy) throw atomicError('CARD_USED');
      data.charging_cards=cards.filter(function(c){return c.id!==id;});
      pushActivityAtomic(data,'حذف بطاقة غير مستخدمة: '+card.number);
    }).then(function(){delete state.selectedCards[id];toast('success','تم حذف البطاقة');render();})
      .catch(function(err){if(err&&err.code==='CARD_USED')toast('error','لا يمكن حذف بطاقة مستخدمة أو ملغاة');else{console.error(err);toast('error','تعذر حذف البطاقة');}});
  });
}

function doDelSelectedCards(){
  var ids=Object.keys(state.selectedCards).filter(function(k){return state.selectedCards[k];}).map(Number);
  if(!ids.length)return;
  var local=ls('charging_cards')||[];
  var activeIds=ids.filter(function(id){var c=local.find(function(x){return x.id===id;});return c&&c.status==='نشطة'&&!c.usedBy;});
  var skipped=ids.length-activeIds.length;
  if(!activeIds.length){toast('warning','لا توجد بطاقات نشطة غير مستخدمة ضمن المحدد');return;}
  showConfirm('سيتم حذف '+activeIds.length+' بطاقة نشطة غير مستخدمة'+(skipped?' وتجاهل '+skipped+' بطاقة محفوظة للسجل':'')+'. إذا كانت مطبوعة فلن تعمل بعد الحذف. متابعة؟',function(){
    if(!fbReady){toast('error','يلزم اتصال بالإنترنت');return;}
    atomicUpdate(['charging_cards','activity_log'],function(data){
      var cards=Array.isArray(data.charging_cards)?data.charging_cards:[];
      var removable={};
      cards.forEach(function(c){if(activeIds.indexOf(c.id)!==-1&&c.status==='نشطة'&&!c.usedBy)removable[c.id]=true;});
      var n=Object.keys(removable).length;
      data.charging_cards=cards.filter(function(c){return !removable[c.id];});
      pushActivityAtomic(data,'حذف '+n+' بطاقة نشطة غير مستخدمة');return n;
    }).then(function(n){state.selectedCards={};toast('success','تم حذف '+n+' بطاقة غير مستخدمة');render();})
      .catch(function(err){console.error(err);toast('error','تعذر حذف البطاقات');});
  });
}

function doDelFilteredCards(){
  var cards=ls('charging_cards')||[];
  var selBatch=state.cardsFilterBatch||'all';
  var filtered=selBatch==='all'?cards:cards.filter(function(c){return (c.batchId||'none')===selBatch;});
  var active=filtered.filter(function(c){return c.status==='نشطة'&&!c.usedBy;});
  var protectedCount=filtered.length-active.length;
  if(!active.length){toast('warning','لا توجد بطاقات نشطة غير مستخدمة للحذف');return;}
  var ids=active.map(function(c){return c.id;});
  var msg='حذف '+active.length+' بطاقة نشطة غير مستخدمة'+(protectedCount?' مع الإبقاء على '+protectedCount+' بطاقة مستخدمة/ملغاة للسجل':'')+'؟ إذا كانت البطاقات مطبوعة فلن تعمل بعد الحذف.';
  showConfirm(msg,function(){
    if(!fbReady){toast('error','يلزم اتصال بالإنترنت');return;}
    atomicUpdate(['charging_cards','activity_log'],function(data){
      var latest=Array.isArray(data.charging_cards)?data.charging_cards:[];
      var idset={};ids.forEach(function(id){idset[id]=true;});
      var n=0;
      data.charging_cards=latest.filter(function(c){if(idset[c.id]&&c.status==='نشطة'&&!c.usedBy){n++;return false;}return true;});
      pushActivityAtomic(data,'حذف '+n+' بطاقة نشطة غير مستخدمة');return n;
    }).then(function(n){state.selectedCards={};toast('success','تم حذف '+n+' بطاقة غير مستخدمة');render();})
      .catch(function(err){console.error(err);toast('error','تعذر حذف البطاقات');});
  });
}
